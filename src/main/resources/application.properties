# ERRORCab Spring Boot Configuration
spring.application.name=errorcab

# Bind to 0.0.0.0 so the application is accessible on local network (http://<COMPUTER-IP>:8080)
server.address=0.0.0.0
server.port=8080

# SQLite Local Persistent Database
spring.datasource.url=jdbc:sqlite:errorcab.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# Logging
logging.level.com.errorcab=INFO
logging.level.org.springframework.web=INFO

# Security Hardening: Prevent stack trace leakage in error responses
server.error.include-stacktrace=never
server.error.whitelabel.enabled=false
server.error.include-message=always

# ERRORCab AI Copilot Multi-Provider Configuration
# Supported providers: local (default, 100% offline), groq, openrouter, gemini
copilot.provider=${COPILOT_PROVIDER:local}

# Local Rule Engine + Destination Intelligence (Always active as baseline and zero-downtime fallback)

# Google Gemini (Optional)
gemini.api.key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-3.5-flash}
gemini.timeout-seconds=12

# Groq Cloud (Free external high-speed AI)
groq.api.key=${GROQ_API_KEY:}
groq.model=${GROQ_MODEL:llama-3.3-70b-versatile}

# OpenRouter (Free tier AI models)
openrouter.api.key=${OPENROUTER_API_KEY:}
openrouter.model=${OPENROUTER_MODEL:meta-llama/llama-3.3-70b-instruct:free}
