# ERRORCab Spring Boot Configuration
spring.application.name=errorcab

# Bind to 0.0.0.0 so the application is accessible on local network (http://<COMPUTER-IP>:8080)
server.address=0.0.0.0
server.port=8080

# SQLite Local Persistent Database
spring.datasource.url=jdbc:sqlite:errorcab.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# Logging
logging.level.com.errorcab=INFO
logging.level.org.springframework.web=INFO

# Security Hardening: Prevent stack trace leakage in error responses
server.error.include-stacktrace=never
server.error.whitelabel.enabled=false
server.error.include-message=always
